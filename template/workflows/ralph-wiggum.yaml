name: ralph-wiggum
description: |
  Use when: User wants to run the Ralph Wiggum autonomous plan/build/review
            lifecycle (a port of marc0der/ralph) on this project.
  Triggers: "ralph wiggum", "run ralph", "ralph loop", "ralph plan/build".
  Does: Archives the previous cycle's artifacts to .ralph/<timestamp>/, seeds
        IMPLEMENTATION_PLAN.md and PROGRESS.md from the templates, runs the
        PLAN loop to convergence, then repeats build-to-exhaustion and review
        as one cycle — each BUILD iteration implements one plan item with a
        fresh context, tests, commits and pushes; each REVIEW iteration audits
        the shipped items and files findings as new plan items — cycling again
        while open items remain, and stopping when a review pass files nothing
        or the cycle cap is reached. Ends with a factual lifecycle report.
  NOT for: PR reviews, one-off fixes, or PRD/story-driven work.

# The goal is the positional message: `archon workflow run ralph-wiggum "<goal>"`.
# It reaches the prompts as $ARGUMENTS and `ralph-precondition` requires it.
#
# Model is set at the WORKFLOW level by decision: one model drives every phase,
# and the prompts delegate heavy reasoning to subagents rather than to a second
# model. Drop to `sonnet` for faster, cheaper iterations.
#
# The three phases live in ralph-plan.yaml, ralph-build.yaml and
# ralph-review.yaml and are inlined here with `include:`. Archon writes an
# included file's provider, model and sandbox onto its own nodes before
# inlining them, so the blocks below run under the PHASE file's provider, model
# and sandbox — not under these. All four files therefore carry the same values
# and must stay matched; a divergence changes the composed run silently.
#
# Isolation: the run acts on the live checkout, like ralph. Commit and branch
# state is the operator's, and nested repositories are reached where they sit.
# `worktree:` is run-owned: the phase files' copies are dropped when composed
# and this one applies to every block.
provider: claude
model: opus

worktree:
  enabled: false

# The boundary for a run Archon executes with permissions bypassed. Writes stay
# allowed outside the denials below, because a nested repository may sit
# anywhere; extend the domain allowlist with your own git host and registries.
# This block governs the nodes declared here; extending the boundary for the
# phases means editing all four workflow files.
sandbox:
  enabled: true
  autoAllowBashIfSandboxed: true
  filesystem:
    denyWrite: ["~/.ssh", "~/.gnupg", "~/.aws", "~/.config/gh", "~/.archon/config.yaml"]
  network:
    allowedDomains: ["github.com", "api.github.com", "registry.npmjs.org", "bun.sh"]

inputs:
  skip_push:
    default: false
    description: Do not push the workspace after a build iteration.
  cycle_cap:
    default: 3
    description: Maximum build-review cycles before the run stops.

nodes:
  # ═══════════════════════════════════════════════════════════════════════
  # PRECONDITION — fail fast on a goalless run, a detached HEAD, a
  # non-repository or a missing tool. It writes nothing, so a resume may
  # reuse its verdict.
  #
  # `plan` mode is the one that requires the goal, and it runs here before
  # `seed`, so a goalless run stops before anything is archived. The plan
  # block runs its own copy again, which is cheap and keeps the block
  # standalone.
  # ═══════════════════════════════════════════════════════════════════════
  - id: precondition
    script: ralph-precondition
    runtime: bun
    with: { mode: plan }

  # ═══════════════════════════════════════════════════════════════════════
  # SEED — archive the previous cycle, scaffold the artifacts from
  # .archon/ralph/templates/, ignore them, and record the run's settings and
  # starting repository state (`ralph archive` + `ralph init`).
  #
  # `archive` mode is this node's alone. Every block runs the same script in
  # `init` mode, which scaffolds only what is absent and merges its inputs
  # into the settings this node wrote, so the plan a block is about to build
  # is never filed away mid-run. A node's `with:` merges over the run's
  # inputs, so skip_push and cycle_cap still reach this node's environment.
  #
  # The one exception to the always_run rule: archiving must not repeat
  # within a run, so a resume reuses the cached output and leaves the live
  # plan alone (ralph's RESUME_FLOOR). Resume is unsupported either way —
  # abort.txt survives, so a mistaken one fails at the same guard.
  # ═══════════════════════════════════════════════════════════════════════
  - id: seed
    depends_on: [precondition]
    script: ralph-seed
    runtime: bun
    with: { mode: archive }

  # ═══════════════════════════════════════════════════════════════════════
  # PLAN — analyse specs + code, write IMPLEMENTATION_PLAN.md. The block is
  # ralph-plan.yaml inlined: its nodes run in THIS run, namespaced
  # `plan__<node-id>`, so they share ARTIFACTS_DIR and the outcome log,
  # settings and counters keep working unchanged. `depends_on: [seed]`
  # attaches to the block's entry node, and `$plan` waits on every sink of
  # it. The block's own report prints the interim plan row; the summary
  # below is the product.
  # ═══════════════════════════════════════════════════════════════════════
  - id: plan
    depends_on: [seed]
    include: ralph-plan

  # ═══════════════════════════════════════════════════════════════════════
  # CYCLE — one iteration is one ralph cycle: build to exhaustion, then
  # review. The group completes when the plan holds no open items or the
  # cycle cap is reached. maxBudgetUsd is the money bound; max_iterations is
  # a ceiling cycle_cap must stay below.
  #
  # The body is the two phase files inlined. Each keeps its own counts node,
  # `when:` guard, snapshot, cap script and guard, so a build with nothing
  # open and a review with nothing shipped skip and report exactly as they
  # do standalone. `review` depends on `build`, which waits on every sink of
  # the build block — its guard included, so a rejected push stops the cycle
  # before the audit.
  # ═══════════════════════════════════════════════════════════════════════
  - id: cycle
    depends_on: [plan]
    maxBudgetUsd: 50
    loop_group:
      max_iterations: 20
      until_bash: bun run .archon/scripts/ralph-cycle-cap.ts "$ARTIFACTS_DIR"
      nodes:
        # skip_push is the one input a block reads. It reaches the build cap
        # through settings.json, which the block's `init` merges it into;
        # the expander substitutes this run's value at load time.
        - id: build
          include: ralph-build
          with: { skip_push: "$INPUTS.skip_push" }

        - id: review
          depends_on: [build]
          include: ralph-review

  # ═══════════════════════════════════════════════════════════════════════
  # REPORT — the factual lifecycle summary, from outcome.log, abort.txt,
  # run-start.txt and the plan. Read-only, and exits 0 even after an abort:
  # the guard already failed the run, and the summary is the product.
  #
  # It names every upstream id rather than `cycle` alone: the join rule
  # relaxes the state a dependency may be in, not the set, so a failed
  # precondition, seed or plan would otherwise leave `cycle` unreachable and
  # the summary unprinted. `auto` is the mode that prints it.
  # ═══════════════════════════════════════════════════════════════════════
  - id: report
    depends_on: [precondition, seed, plan, cycle]
    trigger_rule: all_done
    script: ralph-report
    runtime: bun
    with: { mode: auto }
    always_run: true
