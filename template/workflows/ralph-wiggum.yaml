name: ralph-wiggum
description: |
  Use when: User wants to run the Ralph Wiggum autonomous plan/build/review
            lifecycle (a port of marc0der/ralph) on this project.
  Triggers: "ralph wiggum", "run ralph", "ralph loop", "ralph plan/build".
  Does: Archives the previous cycle's artifacts to .ralph/<timestamp>/, seeds
        IMPLEMENTATION_PLAN.md and PROGRESS.md from the templates, runs the
        PLAN loop to convergence, then repeats build-to-exhaustion and review
        as one cycle — each BUILD iteration implements one plan item with a
        fresh context, tests, commits and pushes; each REVIEW iteration audits
        the shipped items and files findings as new plan items — cycling again
        while open items remain, and stopping when a review pass files nothing
        or the cycle cap is reached. Ends with a factual lifecycle report.
  NOT for: PR reviews, one-off fixes, or PRD/story-driven work.

# The goal is the positional message: `archon workflow run ralph-wiggum "<goal>"`.
# It reaches the prompts as $ARGUMENTS and `ralph-precondition` requires it.
#
# Model is set at the WORKFLOW level by decision: one model drives every phase,
# and the prompts delegate heavy reasoning to subagents rather than to a second
# model. Drop to `sonnet` for faster, cheaper iterations.
#
# Isolation: the run acts on the live checkout, like ralph. Commit and branch
# state is the operator's, and nested repositories are reached where they sit.
provider: claude
model: opus

worktree:
  enabled: false

# The boundary for a run Archon executes with permissions bypassed. Writes stay
# allowed outside the denials below, because a nested repository may sit
# anywhere; extend the domain allowlist with your own git host and registries.
sandbox:
  enabled: true
  autoAllowBashIfSandboxed: true
  filesystem:
    denyWrite: ["~/.ssh", "~/.gnupg", "~/.aws", "~/.config/gh", "~/.archon/config.yaml"]
  network:
    allowedDomains: ["github.com", "api.github.com", "registry.npmjs.org", "bun.sh"]

inputs:
  skip_push:
    default: false
    description: Do not push the workspace after a build iteration.
  cycle_cap:
    default: 3
    description: Maximum build-review cycles before the run stops.

nodes:
  # ═══════════════════════════════════════════════════════════════════════
  # PRECONDITION — fail fast on a goalless run, a detached HEAD, a
  # non-repository or a missing tool. It writes nothing, so a resume may
  # reuse its verdict.
  # ═══════════════════════════════════════════════════════════════════════
  - id: precondition
    script: ralph-precondition
    runtime: bun

  # ═══════════════════════════════════════════════════════════════════════
  # SEED — archive the previous cycle, scaffold the artifacts from
  # .archon/ralph/templates/, ignore them, and record the run's settings and
  # starting repository state (`ralph archive` + `ralph init`).
  #
  # The one exception to the always_run rule: archiving must not repeat
  # within a run, so a resume reuses the cached output and leaves the live
  # plan alone (ralph's RESUME_FLOOR). Resume is unsupported either way —
  # abort.txt survives, so a mistaken one fails at the same guard.
  # ═══════════════════════════════════════════════════════════════════════
  - id: seed
    depends_on: [precondition]
    script: ralph-seed
    runtime: bun

  # ═══════════════════════════════════════════════════════════════════════
  # PLAN — analyse specs + code, write IMPLEMENTATION_PLAN.md. The snapshot
  # records the plan fingerprint the cap compares against; the cap stops on
  # an unchanged fingerprint or at ralph's cap of 6 passes, both graceful.
  # max_iterations is a safety ceiling above the cap, never the bound.
  # ═══════════════════════════════════════════════════════════════════════
  - id: plan-snapshot
    depends_on: [seed]
    script: ralph-snapshot
    runtime: bun
    with: { mode: plan }
    always_run: true

  - id: plan
    depends_on: [plan-snapshot]
    idle_timeout: 600000
    loop:
      command: ralph-plan
      max_iterations: 7
      fresh_context: true
      until_bash: bun run .archon/scripts/ralph-plan-cap.ts "$ARTIFACTS_DIR"

  # ═══════════════════════════════════════════════════════════════════════
  # CYCLE — one iteration is one ralph cycle: build to exhaustion, then
  # review. The group completes when the plan holds no open items or the
  # cycle cap is reached. maxBudgetUsd is the money bound; max_iterations is
  # a ceiling cycle_cap must stay below.
  # ═══════════════════════════════════════════════════════════════════════
  - id: cycle
    depends_on: [plan]
    maxBudgetUsd: 50
    loop_group:
      max_iterations: 20
      until_bash: bun run .archon/scripts/ralph-cycle-cap.ts "$ARTIFACTS_DIR"
      nodes:
        # ─────────────────────────────────────────────────────────────────
        # BUILD — one plan item per fresh iteration. Guarded on open items,
        # read from the plan as it stands at the start of this cycle. The
        # cap stops on an exhausted plan, two iterations with no repository
        # change, or the spent budget; the guard fails the run on a marker
        # the cap wrote (a rejected push).
        # ─────────────────────────────────────────────────────────────────
        - id: counts-pre-build
          script: ralph-counts
          runtime: bun
          always_run: true

        - id: build-snapshot
          depends_on: [counts-pre-build]
          when: "$counts-pre-build.output.open > 0"
          script: ralph-snapshot
          runtime: bun
          with: { mode: build }
          always_run: true

        - id: build
          depends_on: [build-snapshot]
          idle_timeout: 600000
          loop:
            command: ralph-build
            max_iterations: 200
            fresh_context: true
            until_bash: bun run .archon/scripts/ralph-build-cap.ts "$ARTIFACTS_DIR"

        - id: build-guard
          depends_on: [build]
          trigger_rule: all_done
          script: ralph-guard
          runtime: bun
          always_run: true

        # ─────────────────────────────────────────────────────────────────
        # REVIEW — audit the shipped items and file findings as new plan
        # items. Guarded on a plan with nothing open and something shipped,
        # so a build that stopped short leaves the audit to the next cycle.
        # The cap aborts a pass that un-ticks an item; the guard fails on it.
        # The join rule on the guards is what lets a node run after a loop
        # upstream was skipped as well as after one that ran.
        # ─────────────────────────────────────────────────────────────────
        - id: counts-pre-review
          depends_on: [build-guard]
          trigger_rule: all_done
          script: ralph-counts
          runtime: bun
          always_run: true

        - id: review-snapshot
          depends_on: [counts-pre-review]
          when: "$counts-pre-review.output.open == 0 && $counts-pre-review.output.shipped > 0"
          script: ralph-snapshot
          runtime: bun
          with: { mode: review }
          always_run: true

        - id: review
          depends_on: [review-snapshot]
          idle_timeout: 600000
          loop:
            command: ralph-review
            max_iterations: 7
            fresh_context: true
            until_bash: bun run .archon/scripts/ralph-review-cap.ts "$ARTIFACTS_DIR"

        - id: review-guard
          depends_on: [review]
          trigger_rule: all_done
          script: ralph-guard
          runtime: bun
          always_run: true

  # ═══════════════════════════════════════════════════════════════════════
  # REPORT — the factual lifecycle summary, from outcome.log, abort.txt,
  # run-start.txt and the plan. Read-only, and exits 0 even after an abort:
  # the guard already failed the run, and the summary is the product.
  # ═══════════════════════════════════════════════════════════════════════
  - id: report
    depends_on: [cycle]
    trigger_rule: all_done
    script: ralph-report
    runtime: bun
    always_run: true
