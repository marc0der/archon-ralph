name: ralph-build
description: |
  Use when: User wants only the BUILD phase of the Ralph Wiggum lifecycle —
            implement the plan that is already in IMPLEMENTATION_PLAN.md, and
            plan nothing new.
  Triggers: "ralph build", "build the plan", "implement the implementation plan".
  Does: Builds to exhaustion — each iteration takes the topmost open plan item
        with a fresh context, implements it, verifies it, commits and pushes,
        stopping on an exhausted plan, two iterations that moved no repository,
        or the spent budget. Fails the run on a rejected push. Ends with the
        build row, the plan counts and the repositories that moved. A plan with
        nothing open is skipped and reported, not an error.
  NOT for: Writing the plan (ralph-plan), auditing it (ralph-review), or the
           whole lifecycle (ralph-wiggum).

# No goal: the plan in the tree is the input. A positional message is neither
# required nor refused — composed, it is `ralph-wiggum`'s goal.
#
# This file is both a standalone workflow and the block `ralph-wiggum` inlines
# with `include: ralph-build`. Archon writes an included file's provider, model
# and sandbox onto its own nodes before inlining them, so these blocks govern
# the build phase in a composed run too: they match `ralph-wiggum.yaml` and must
# stay matched. `worktree:` is run-owned and dropped when composed.
provider: claude
model: opus

worktree:
  enabled: false

# The boundary for a run Archon executes with permissions bypassed. Writes stay
# allowed outside the denials below, because a nested repository may sit
# anywhere; extend the domain allowlist with your own git host and registries.
sandbox:
  enabled: true
  autoAllowBashIfSandboxed: true
  filesystem:
    denyWrite: ["~/.ssh", "~/.gnupg", "~/.aws", "~/.config/gh", "~/.archon/config.yaml"]
  network:
    allowedDomains: ["github.com", "api.github.com", "registry.npmjs.org", "bun.sh"]

inputs:
  skip_push:
    default: false
    description: Do not push the workspace after a build iteration.

nodes:
  # ═══════════════════════════════════════════════════════════════════════
  # PRECONDITION — fail fast on a detached HEAD, a non-repository or a
  # missing tool. It writes nothing, so a resume may reuse its verdict.
  # `build` mode checks the work tree and the tools but never the goal.
  # ═══════════════════════════════════════════════════════════════════════
  - id: precondition
    script: ralph-precondition
    runtime: bun
    with: { mode: build }

  # ═══════════════════════════════════════════════════════════════════════
  # INIT — `ralph init` and nothing more: scaffold each artifact only when
  # absent, create specs/, maintain .gitignore, and record the run's start
  # once. It archives nothing, so the plan this block is about to build
  # survives. skip_push is merged into settings.json, which is where
  # ralph-build-cap reads it; composed, the expander substitutes
  # `ralph-wiggum`'s value here and the cycle_cap already in the file stays.
  # ═══════════════════════════════════════════════════════════════════════
  - id: init
    depends_on: [precondition]
    script: ralph-seed
    runtime: bun
    with: { mode: init, skip_push: "$INPUTS.skip_push" }
    always_run: true

  # ═══════════════════════════════════════════════════════════════════════
  # BUILD — one plan item per fresh iteration. Guarded on open items, read
  # from the plan as it stands at the start of this block. The cap stops on
  # an exhausted plan, two iterations with no repository change, or the
  # spent budget; the guard fails the run on a marker the cap wrote (a
  # rejected push). The join rule on the guard is what lets it run after a
  # loop that was skipped as well as after one that ran.
  # ═══════════════════════════════════════════════════════════════════════
  - id: counts
    depends_on: [init]
    script: ralph-counts
    runtime: bun
    always_run: true

  - id: snapshot
    depends_on: [counts]
    when: "$counts.output.open > 0"
    script: ralph-snapshot
    runtime: bun
    with: { mode: build }
    always_run: true

  - id: build
    depends_on: [snapshot]
    idle_timeout: 600000
    loop:
      command: ralph-build
      max_iterations: 200
      fresh_context: true
      until_bash: bun run .archon/scripts/ralph-build-cap.ts "$ARTIFACTS_DIR"

  - id: guard
    depends_on: [build]
    trigger_rule: all_done
    script: ralph-guard
    runtime: bun
    always_run: true

  # ═══════════════════════════════════════════════════════════════════════
  # REPORT — the build row, the plan counts and the repositories that
  # moved, from outcome.log, run-start.txt and the plan. The join rule is
  # what makes it print on every exit path: a failed precondition, init or
  # build loop still reports. Read-only, and exits 0 even after an abort —
  # the guard already failed the run.
  # ═══════════════════════════════════════════════════════════════════════
  - id: report
    depends_on: [precondition, init, counts, snapshot, build, guard]
    trigger_rule: all_done
    script: ralph-report
    runtime: bun
    with: { mode: build }
    always_run: true
